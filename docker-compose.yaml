services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: felix
      POSTGRES_PASSWORD: "1997"
      POSTGRES_DB: yumyum
    ports:
      - "5432:5432"
    volumes:
      - ./lib/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felix -d yumyum"]
      interval: 5s
      timeout: 5s
      retries: 5
