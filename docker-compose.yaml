services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tmrqY3iYa5JbljX
      POSTGRES_DB: delmer-backend-db
    ports:
      - "5432:5432"
    volumes:
      - ./lib/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felix -d delmer-backend-db"]
      interval: 5s
      timeout: 5s
      retries: 5
